# Run pp_solvers' tests against a given PorePy commit, and report the result
# on the PorePy PR that the commit belongs to.
#
# Triggered only by workflow_dispatch, from PorePy's
# .github/workflows/trigger-downstream-tests.yml on PRs into, and pushes to,
# PorePy's develop. The inputs below are the interface to that workflow.
# test-in-docker.yml is pp_solvers' own CI and is unaffected.
#
# The tests run in the porepy/extended Docker image: the PorePy clone in the
# image is checked out at the requested commit and reinstalled before
# pp_solvers' develop is tested.
#
# If porepy_pr_number is set, a failure creates or updates a comment on that
# PR, found by a hidden marker. A pass only updates an existing comment, so PRs
# that never broke pp_solvers get no comment. Without a PR number, failures
# are written to the job summary.
#
# Debugging: run manually via "Run workflow" in the Actions tab. If no run
# appears, check the dispatching run in PorePy. If no comment appears, check
# that DOWNSTREAM_DISPATCH_PAT has write access to PorePy's pull requests.
# Docs: https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow
name: PorePy integration test

on:
  workflow_dispatch:
    inputs:
      porepy_ref:
        description: 'porepy branch to check out if porepy_sha is not set'
        required: true
        default: 'develop'
      porepy_sha:
        description: 'porepy commit SHA to check out (takes precedence over porepy_ref)'
        required: false
        default: ''
      porepy_pr_number:
        description: 'porepy PR number to comment on if the run fails (empty = no comment)'
        required: false
        default: ''
      trigger_event:
        description: 'What triggered this dispatch (push, pull_request, ...)'
        required: false
        default: 'push'

# A re-dispatch of the same PorePy commit cancels the older run.
concurrency:
  group: downstream-dispatch-${{ inputs.porepy_sha || inputs.porepy_ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: porepy/extended:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Docker image
        run: docker pull $DOCKER_IMAGE

      - name: Run tests inside container against requested porepy ref
        env:
          CHECKOUT_REF: ${{ inputs.porepy_sha != '' && inputs.porepy_sha || inputs.porepy_ref }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" \
            -e CHECKOUT_REF="$CHECKOUT_REF" \
            $DOCKER_IMAGE \
            bash -c "
              set -e
              cd ~/porepy &&
              git fetch origin &&
              git checkout \"\$CHECKOUT_REF\" &&
              pip install -e . &&
              cd ~/pp_solvers &&
              git fetch origin develop &&
              git checkout develop &&
              git pull origin develop &&
              pip install -e .
              pytest -v
            "

      # Not run on cancellation. On failure, create or edit the marked
      # comment; on success, only edit an existing one.
      - name: Update comment on porepy PR
        if: (success() || failure()) && inputs.porepy_pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ inputs.porepy_pr_number }}
          TESTED_REF: ${{ inputs.porepy_sha || inputs.porepy_ref }}
          TRIGGER_EVENT: ${{ inputs.trigger_event }}
        run: |
          MARKER="<!-- downstream-ci-comment: pp_solvers -->"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$JOB_STATUS" = "success" ]; then
            HEADLINE="### ✅ pp_solvers integration test passed"
            RESULT="passed"
          else
            HEADLINE="### ❌ pp_solvers integration test failed"
            RESULT="failed"
          fi
          BODY="$MARKER
          $HEADLINE

          Testing against porepy \`$TESTED_REF\` (triggered by \`$TRIGGER_EVENT\`) $RESULT in [pp_solvers]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api --paginate "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          elif [ "$JOB_STATUS" != "success" ]; then
            gh api --method POST "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" -f body="$BODY"
          else
            echo "Passed, and no earlier comment on porepy PR #$PR_NUMBER; nothing to update."
          fi

      - name: Log failure to job summary if no PR to comment on
        if: failure() && inputs.porepy_pr_number == ''
        run: |
          echo "### pp_solvers integration test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No originating porepy PR was resolved for \`${{ inputs.porepy_sha || inputs.porepy_ref }}\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
