# Run pp_solvers' tests in the porepy/extended Docker image, against PorePy's
# current develop. On a failed nightly run, the tested PorePy commit is written
# to the job summary; the container passes it out through the mounted
# workspace. Testing of specific PorePy commits is done in
# porepy-integration-test.yml.
name: Test in Docker

on:
  workflow_dispatch:
    # run jobs manually
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: porepy/extended:latest
      TEST_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Docker image
        run: docker pull $DOCKER_IMAGE

      - name: Run tests inside container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" $DOCKER_IMAGE \
            bash -c "
              cd ~/porepy &&
              git pull &&
              pip install pyproject.toml --upgrade
              (git rev-parse HEAD > /workspace/porepy_sha.txt || true) &&
              # ^ read by the nightly failure step. Never fatal, so a failed
              #   write cannot skip the cd into pp_solvers below.
              cd ~/pp_solvers &&
              git fetch origin $TEST_BRANCH &&
              git checkout $TEST_BRANCH &&
              git pull origin $TEST_BRANCH &&
              pip install pyproject.toml --upgrade
              pip install -e .  # If a new dependency is listed, and the image is not updated yet.
              pip freeze
              pytest -v
            "

      - name: Log tested porepy commit if nightly run failed
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "### pp_solvers nightly test failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -f porepy_sha.txt ]; then
            echo "Tested against porepy \`$(cat porepy_sha.txt)\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed before the tested porepy SHA was recorded; see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
