# pp_solvers' own everyday CI: builds/tests inside the pre-built
# `porepy/extended` Docker image on every push/PR to this repo, plus a
# nightly run. `TEST_BRANCH` controls which *pp_solvers* branch is checked
# out inside the container (the porepy checkout in that image is just
# whatever `git pull` on its default branch picks up -- not pinned to any
# specific porepy commit). This is intentionally unrelated to the
# porepy-triggered dispatch mechanism in porepy-integration-test.yml (which
# tests a *specific* porepy PR/SHA and is only ever started by porepy) -- the
# two workflows share no state.
#
# The one piece of cross-repo behavior added here (on top of the pre-existing
# CI) is: on a nightly (`schedule`) run only, capture which porepy commit was
# actually tested, and on failure, resolve which porepy PR most recently
# merged that commit and post a comment there -- so a porepy regression that
# only shows up nightly doesn't sit unnoticed for up to 24h. See
# `.claude/downstream_testing.md` in the porepy repo for why this exists
# (Phase 1 of that design) and porepy-integration-test.yml in this repo for
# the immediate-dispatch counterpart (Phase 2/3, same comment-upsert
# pattern, triggered right away from porepy instead of waiting for the
# nightly cron).
#
# Debugging the nightly comment-back step specifically:
#   - `-v "${{ github.workspace }}:/workspace"` bind-mounts this job's
#     checkout directory into the container as /workspace -- the only way
#     for a value computed *inside* the container (the porepy SHA) to become
#     visible to a step running *outside* it afterward. The container writes
#     it to /workspace/porepy_sha.txt; the runner-side step reads it back as
#     the plain file `porepy_sha.txt` (relative to github.workspace, the
#     default working directory).
#   - The comment step only runs `if: failure() && github.event_name ==
#     'schedule'` -- an ordinary PR/push CI failure on pp_solvers never
#     triggers a comment anywhere.
#   - If `porepy_sha.txt` doesn't exist when this step runs, the container
#     script failed before reaching the `git rev-parse HEAD > ...` line
#     (e.g. `docker pull` failed, or the `git pull` inside the container
#     failed) -- check the "Run tests inside container" step's log first;
#     the fallback message here just says "nowhere to comment", not why.
#   - The PR lookup and comment upsert (marker-comment search, then
#     PATCH-or-POST) follow the same logic as porepy-integration-test.yml's
#     failure step in this repo -- see that file's header comment for the
#     mechanics if something here is unclear.
name: Test in Docker

on:
  workflow_dispatch:
    # run jobs manually
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: porepy/extended:latest
      TEST_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Docker image
        run: docker pull $DOCKER_IMAGE

      - name: Run tests inside container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" $DOCKER_IMAGE \
            bash -c "
              cd ~/porepy &&
              git pull &&
              pip install pyproject.toml --upgrade
              (git rev-parse HEAD > /workspace/porepy_sha.txt || true) &&
              # ^ record the exact commit under test into the mounted
              #   workspace, so the runner-side comment-back step (which has
              #   no visibility into the container) can read it afterward.
              #   Never fatal: a failed write must not break the chain and
              #   leave pytest running in the porepy directory.
              cd ~/pp_solvers &&
              git fetch origin $TEST_BRANCH &&
              git checkout $TEST_BRANCH &&
              git pull origin $TEST_BRANCH &&
              pip install pyproject.toml --upgrade
              pip install -e .  # If a new dependency is listed, and the image is not updated yet.
              pip freeze
              pytest -v
            "

      - name: Comment on originating porepy PR if nightly run failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          if [ ! -f porepy_sha.txt ]; then
            echo "### pp_solvers nightly test failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed before the tested porepy SHA could be captured (e.g. docker pull failed); nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          POREPY_SHA=$(cat porepy_sha.txt)
          PR_NUMBER=$(gh api "repos/pmgbergen/porepy/commits/$POREPY_SHA/pulls" --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "### pp_solvers nightly test failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No originating porepy PR was found for \`$POREPY_SHA\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MARKER="<!-- downstream-ci-comment: pp_solvers -->"
          BODY="$MARKER
          ### ❌ pp_solvers nightly integration test failed

          The nightly build against porepy \`$POREPY_SHA\` failed in [pp_solvers]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api --paginate "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api --method POST "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
