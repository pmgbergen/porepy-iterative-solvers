# pp_solvers' own everyday CI: builds/tests inside the pre-built
# `porepy/extended` Docker image on every push/PR to this repo, plus a
# nightly run. `TEST_BRANCH` controls which *pp_solvers* branch is checked
# out inside the container (the porepy checkout in that image is just
# whatever `git pull` on its default branch picks up -- not pinned to any
# specific porepy commit). This is intentionally unrelated to the
# porepy-triggered dispatch mechanism in porepy-integration-test.yml (which
# tests a *specific* porepy PR/SHA and is only ever started by porepy) -- the
# two workflows share no state.
#
# The one addition on top of the pre-existing CI: record which porepy commit
# was tested, and on a failed nightly (`schedule`) run, write it to the job
# summary so the failure can be traced to a porepy commit. It deliberately
# does not comment on any porepy PR: porepy changes are already reported on
# the responsible PR by porepy-integration-test.yml, right when they are
# opened or merged. A nightly failure is more likely caused by a change in
# pp_solvers itself or in the Docker image, and blaming whichever porepy PR
# happens to be at the tip of develop would be wrong.
#
# `-v "${{ github.workspace }}:/workspace"` bind-mounts this job's checkout
# directory into the container as /workspace -- the only way for a value
# computed *inside* the container (the porepy SHA) to become visible to a
# step running *outside* it afterward. The container writes it to
# /workspace/porepy_sha.txt; the runner-side step reads it back as the plain
# file `porepy_sha.txt` (relative to github.workspace, the default working
# directory).
name: Test in Docker

on:
  workflow_dispatch:
    # run jobs manually
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: porepy/extended:latest
      TEST_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Docker image
        run: docker pull $DOCKER_IMAGE

      - name: Run tests inside container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" $DOCKER_IMAGE \
            bash -c "
              cd ~/porepy &&
              git pull &&
              pip install pyproject.toml --upgrade
              (git rev-parse HEAD > /workspace/porepy_sha.txt || true) &&
              # ^ record the exact commit under test into the mounted
              #   workspace, so the runner-side comment-back step (which has
              #   no visibility into the container) can read it afterward.
              #   Never fatal: a failed write must not break the chain and
              #   leave pytest running in the porepy directory.
              cd ~/pp_solvers &&
              git fetch origin $TEST_BRANCH &&
              git checkout $TEST_BRANCH &&
              git pull origin $TEST_BRANCH &&
              pip install pyproject.toml --upgrade
              pip install -e .  # If a new dependency is listed, and the image is not updated yet.
              pip freeze
              pytest -v
            "

      - name: Log tested porepy commit if nightly run failed
        if: failure() && github.event_name == 'schedule'
        run: |
          echo "### pp_solvers nightly test failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -f porepy_sha.txt ]; then
            echo "Tested against porepy \`$(cat porepy_sha.txt)\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed before the tested porepy SHA was recorded; see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
