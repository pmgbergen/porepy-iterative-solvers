name: Test in Docker

on:
  workflow_dispatch:
    # run jobs manually
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: porepy/extended:latest
      TEST_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Docker image
        run: docker pull $DOCKER_IMAGE

      # Iteration counts in the regression tests can depend on the CPU (e.g. through
      # vectorized math kernels). Record the hardware and the exact image, so that
      # failures can be correlated with them. The container runs on the same CPU.
      - name: Log runner hardware and image
        run: |
          {
            echo "### Test environment"
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores"
            echo "- AVX-512: $(grep -q avx512f /proc/cpuinfo && echo yes || echo no)"
            echo "- Image: $(docker image inspect --format '{{index .RepoDigests 0}}' $DOCKER_IMAGE)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # PorePy and pp_solvers are editable installs in the image, so pulling updates
      # the code. Reinstalling with 'pip install -e .' picks up dependencies that were
      # added after the image was built, without upgrading the existing ones. The
      # commands are chained, so that a failure in any of them fails the job.
      # Threading is disabled, since multithreaded BLAS and direct solvers are not
      # guaranteed to give bitwise reproducible results. numpy.show_runtime() logs
      # the BLAS library and the CPU kernels it uses.
      - name: Run tests inside container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            $DOCKER_IMAGE \
            bash -c "
              cd ~/porepy &&
              git pull &&
              pip install -e . &&
              git rev-parse HEAD > /workspace/porepy_sha.txt &&
              cd ~/pp_solvers &&
              git fetch origin $TEST_BRANCH &&
              git checkout $TEST_BRANCH &&
              git pull origin $TEST_BRANCH &&
              pip install -e . &&
              pip freeze &&
              python -c 'import numpy; numpy.show_runtime()' &&
              pytest -v
            "

      - name: Comment on originating porepy PR if nightly run failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          if [ ! -f porepy_sha.txt ]; then
            echo "### pp_solvers nightly test failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed before the tested porepy SHA could be captured (e.g. docker pull failed); nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          POREPY_SHA=$(cat porepy_sha.txt)
          PR_NUMBER=$(gh api "repos/pmgbergen/porepy/commits/$POREPY_SHA/pulls" --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "### pp_solvers nightly test failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No originating porepy PR was found for \`$POREPY_SHA\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MARKER="<!-- downstream-ci-comment: pp_solvers -->"
          BODY="$MARKER
          ### ❌ pp_solvers nightly integration test failed

          The nightly build against porepy \`$POREPY_SHA\` failed in [pp_solvers]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api --method POST "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
